version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: archery_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archery_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-archery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: archery_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      POSTGRES_DB: ${POSTGRES_DB:-archery_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-archery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Archery Tracker Kenya <onboarding@resend.dev>}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:5000}
    depends_on:
      - postgres

  client:
    build: ./client
    container_name: archery_client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
